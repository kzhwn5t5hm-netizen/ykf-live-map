<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Join YKF Live Map</title><style>:root{--bg:#030914;--panel:#0d2130;--ink:#edf6fb;--muted:#8ca7b7;--orange:#ff8a5b;--blue:#56ccf2;--mint:#7cf5c8;--line:rgba(140,190,220,.18)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(100% 70% at 50% 0,#123048 0,#06101f 54%,#030914 100%);color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif}.wrap{min-height:100vh;padding:24px 18px;display:grid;place-items:center}.card{width:min(480px,100%);border:1px solid var(--line);border-radius:26px;background:rgba(13,33,48,.94);padding:25px;box-shadow:0 25px 80px rgba(0,0,0,.3)}.brand{font-size:12px;font-weight:900;letter-spacing:.15em;color:var(--orange);text-transform:uppercase}.status{margin-top:16px;display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px}.status i{width:9px;height:9px;border-radius:50%;background:#ffc24b}.status.ok i{background:var(--mint)}.status.bad i{background:#ff5f6d}.hero{font-size:46px;margin:22px 0 6px}.card h1{font-size:30px;line-height:1.03;letter-spacing:-.04em;margin:0}.sub{color:var(--muted);font-size:14px;line-height:1.5;margin:10px 0 24px}.field{margin-top:16px}label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#a6becb;font-weight:850;margin-bottom:8px}input,select{width:100%;height:52px;border-radius:14px;border:1px solid var(--line);background:#071a28;color:var(--ink);padding:0 14px;font-size:16px;outline:none}.selectWrap{display:grid;grid-template-columns:54px 1fr;gap:10px}.flag{border:1px solid var(--line);background:#071a28;border-radius:14px;display:grid;place-items:center;font-size:28px}button{width:100%;height:54px;border:0;border-radius:15px;margin-top:22px;background:linear-gradient(90deg,#ff8a5b,#ffb06e);color:#08131c;font-weight:950;font-size:14px;cursor:pointer}button:disabled{opacity:.55}.msg{min-height:20px;margin-top:12px;color:#ff9ba3;font-size:12px}.success{display:none;text-align:center;padding:12px 2px 4px}.success.show{display:block}.sflag{font-size:72px}.success h2{font-size:29px;margin:12px 0 6px}.success p{color:var(--muted);line-height:1.5}.number{display:inline-block;margin-top:14px;padding:9px 14px;border:1px solid rgba(124,245,200,.25);border-radius:999px;color:var(--mint);font-size:12px;font-weight:900}</style></head><body><div class="wrap"><main class="card"><div class="brand">YKF 2026 · LIVE WORLD MAP</div><div class="status" id="status"><i></i><span id="statusText">Checking connection…</span></div><div id="formArea"><div class="hero">🌍</div><h1>Where are you joining from?</h1><p class="sub">Add your name and country. You’ll appear live on the YKF screen.</p><form id="form"><div class="field"><label>Your name</label><input id="name" maxlength="40" autocomplete="name" placeholder="e.g. Salma" required></div><div class="field"><label>Country</label><div class="selectWrap"><div class="flag" id="flag">🌍</div><select id="country" required><option value="">Loading countries…</option></select></div></div><button id="send" type="submit" disabled>JOIN THE LIVE MAP</button><div class="msg" id="msg"></div></form></div><section class="success" id="success"><div class="sflag" id="sflag">🌍</div><h2 id="sname">You’re live!</h2><p id="stext"></p><div class="number" id="snum"></div></section></main></div><script>const $=id=>document.getElementById(id),sel=$('country'),flag=$('flag'),msg=$('msg'),btn=$('send'),status=$('status'),statusText=$('statusText');let countries=[];async function ping(){try{const r=await fetch('/api/ping?x='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;status.className='status ok';statusText.textContent='Connected to the YKF live screen'}catch(e){status.className='status bad';statusText.textContent='Cannot reach the live screen.'}}async function loadCountries(){try{const r=await fetch('https://restcountries.com/v3.1/all?fields=name,cca2,flag,latlng');const d=await r.json();countries=d.filter(c=>c.cca2&&c.latlng?.length===2).map(c=>({code:c.cca2,name:c.name.common,flag:c.flag,lat:c.latlng[0],lon:c.latlng[1]})).sort((a,b)=>a.name.localeCompare(b.name));sel.innerHTML='<option value="">Select your country</option>';for(const c of countries){const o=document.createElement('option');o.value=c.code;o.textContent=`${c.flag}  ${c.name}`;sel.appendChild(o)}btn.disabled=false}catch(e){msg.textContent='Could not load the country list. Refresh the page.'}}ping();setInterval(ping,5000);loadCountries();sel.addEventListener('change',()=>{const c=countries.find(x=>x.code===sel.value);flag.textContent=c?c.flag:'🌍'});$('form').addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';const c=countries.find(x=>x.code===sel.value);if(!c){msg.textContent='Please select a country.';return}btn.disabled=true;btn.textContent='JOINING…';try{const r=await fetch('/api/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,countryCode:c.code,country:c.name,flag:c.flag,lat:c.lat,lon:c.lon})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not join.');const p=d.participant;$('formArea').style.display='none';$('success').classList.add('show');$('sflag').textContent=p.flag;$('sname').textContent=`Welcome, ${p.name}!`;$('stext').textContent=`${p.country} is now live on the YKF world map.`;$('snum').textContent='PARTICIPANT #'+String(p.id).padStart(3,'0')}catch(err){msg.textContent=err.message;btn.disabled=false;btn.textContent='JOIN THE LIVE MAP'}});</script></body></html>
