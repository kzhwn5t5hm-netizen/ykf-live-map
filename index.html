<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YKF 2026 · Where Are You Joining From?</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<style>
:root{--bg:#04111d;--panel:#071a28;--ink:#eef7fc;--muted:#84a2b5;--blue:#55d5ff;--orange:#ff8a5b;--mint:#70ffd0;--line:#1d4053;--land:#1a3a50;--landline:#356078}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020a12;color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif}.stage{position:relative;width:100vw;height:100vh;min-width:900px;min-height:620px;background:linear-gradient(180deg,#061725 0%,#03101b 100%);border:1px solid #18394b;border-radius:27px;overflow:hidden}.hero{position:absolute;left:2.65%;top:4.2%;z-index:5}.kicker{font-size:14px;font-weight:900;letter-spacing:.18em;color:var(--blue);text-transform:uppercase}.hero h1{font-size:clamp(38px,4vw,58px);line-height:1.02;letter-spacing:-.045em;margin:18px 0 7px}.hero p{margin:0;color:var(--muted);font-size:clamp(14px,1.2vw,18px)}.focus{position:absolute;right:2.4%;top:3.8%;z-index:5;color:#537287;font-size:12px;letter-spacing:.04em;text-transform:uppercase}.mapWrap{position:absolute;left:1.8%;right:1.8%;top:16.5%;bottom:7.2%;overflow:hidden}.mapSvg{width:100%;height:100%;display:block}.graticule{fill:none;stroke:rgba(91,135,160,.11);stroke-width:.8}.land{fill:var(--land);stroke:var(--landline);stroke-width:.62}.eventTerritory{fill:var(--land);stroke:var(--landline);stroke-width:.62;vector-effect:non-scaling-stroke}.countryMarker{cursor:pointer}.countryMarker .dot{fill:var(--blue);stroke:#eafaff;stroke-width:1.5}.countryMarker .flagFrame{fill:#061521;stroke:#bfefff;stroke-width:.8}.countryMarker .flagImg{pointer-events:none}.countryMarker .countBg{fill:#06101a;stroke:#89cbe8;stroke-width:.85}.countryMarker .count{fill:#fff;font-size:8px;font-weight:900;text-anchor:middle;dominant-baseline:central;pointer-events:none}.bottom{position:absolute;left:2.65%;right:2.85%;bottom:3.45%;z-index:6;display:flex;align-items:flex-end;gap:16px}.stat{width:195px;height:96px;border:1px solid #24495d;border-radius:20px;background:rgba(10,32,47,.88);padding:19px 21px}.stat strong{display:block;font-size:34px;line-height:1;font-weight:900}.stat span{display:block;margin-top:11px;color:#7da1b8;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.latestMini{margin-left:auto;padding-bottom:10px;color:#7ea1b7;font-size:14px;text-align:right;max-width:38%}.latestMini b{color:#e9f5fb}.joinToast{position:absolute;left:50%;top:50%;z-index:20;width:min(430px,calc(100% - 44px));padding:20px 22px;background:rgba(5,23,35,.985);border:1px solid rgba(112,255,208,.55);border-radius:22px;box-shadow:0 26px 70px rgba(0,0,0,.58);opacity:0;transform:translate(-50%,-50%) scale(.94);pointer-events:none;transition:.2s ease}.joinToast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.joinTop{text-align:center;font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--mint);margin-bottom:15px}.joinBody{display:grid;grid-template-columns:80px minmax(0,1fr);gap:17px;align-items:center}.flagCard{width:80px;height:58px;padding:4px;border:1px solid #285068;border-radius:13px;background:#102d40;overflow:hidden}.flagCard img{width:100%;height:100%;display:block;object-fit:cover;border-radius:8px}.joinName{font-size:25px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.joinCountry{margin-top:4px;color:var(--blue);font-size:15px}.joinNumber{margin-top:6px;color:var(--orange);font-size:12px;font-weight:900;letter-spacing:.08em}.countryPopup{position:absolute;left:50%;top:50%;z-index:22;width:min(360px,calc(100% - 38px));padding:18px;background:rgba(4,20,31,.99);border:1px solid rgba(85,213,255,.55);border-radius:20px;box-shadow:0 26px 70px rgba(0,0,0,.62);display:none;transform:translate(-50%,-50%)}.countryPopup.show{display:block}.popupHead{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center;padding-bottom:13px;border-bottom:1px solid rgba(95,145,170,.22)}.popupFlag{width:72px;height:52px;padding:4px;border:1px solid #285068;border-radius:12px;background:#102d40;overflow:hidden}.popupFlag img{width:100%;height:100%;display:block;object-fit:cover;border-radius:7px}.popupName{font-size:21px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.popupCount{margin-top:4px;color:var(--blue);font-size:12px;font-weight:800}.popupList{max-height:210px;overflow-y:auto;margin-top:9px;padding-right:4px}.popupList::-webkit-scrollbar{width:5px}.popupList::-webkit-scrollbar-thumb{background:#365f75;border-radius:8px}.popupPerson{display:flex;align-items:center;gap:10px;padding:9px 5px;border-bottom:1px solid rgba(95,145,170,.14)}.popupPerson:last-child{border-bottom:0}.popupNum{width:34px;height:30px;display:grid;place-items:center;border-radius:9px;background:#102d40;color:var(--orange);font-size:10px;font-weight:900}.popupPersonName{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.popupHint{text-align:center;color:#6f91a6;font-size:9px;margin-top:9px}@media(max-width:1100px){.stat{width:175px;height:90px}.bottom{gap:12px}.hero h1{font-size:42px}.hero p{font-size:14px}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="hero"><div class="kicker">Live participant map</div><h1>Where are you joining from?</h1><p>Scan, join, and watch the ICESCO community and global guests light up in real time.</p></div>
  <div class="focus">ICESCO FOCUS · <span id="focusCountries">0</span> COUNTRIES</div>
  <div class="mapWrap"><svg id="map" class="mapSvg" viewBox="0 0 1340 650" preserveAspectRatio="xMidYMid meet"></svg></div>
  <div class="joinToast" id="joinToast"><div class="joinTop">New participant joined</div><div class="joinBody"><div class="flagCard"><img id="joinFlag" alt="Country flag"></div><div><div class="joinName" id="joinName"></div><div class="joinCountry" id="joinCountry"></div><div class="joinNumber" id="joinNumber"></div></div></div></div>
  <div class="countryPopup" id="countryPopup"><div class="popupHead"><div class="popupFlag"><img id="popupFlag" alt="Country flag"></div><div><div class="popupName" id="popupName"></div><div class="popupCount" id="popupCount"></div></div></div><div class="popupList" id="popupList"></div><div class="popupHint">Click outside or press Esc to close</div></div>
  <div class="bottom"><div class="stat"><strong id="count">0</strong><span>Participants</span></div><div class="stat"><strong id="countries">0</strong><span>Member states live</span></div><div class="latestMini" id="latestMini">Waiting for the first participant…</div></div>
</div>
<script>
const cfg=window.YKF_CONFIG,api=cfg.supabaseUrl+'/rest/v1/ykf_participants',headers={apikey:cfg.supabaseKey};
const flagUrl=(code,w=160)=>`https://flagcdn.com/w${w}/${String(code||'').toLowerCase()}.png`;
function setFlag(id,code,name){const img=document.getElementById(id);img.src=flagUrl(code);img.alt=(name||code||'Country')+' flag';img.onerror=()=>{img.onerror=null;img.src='https://flagcdn.com/w160/un.png'}}
const svg=d3.select('#map');
const projection=d3.geoNaturalEarth1().fitExtent([[14,8],[1326,642]],{type:'Sphere'});
const path=d3.geoPath(projection);
svg.append('path').datum(d3.geoGraticule10()).attr('class','graticule').attr('d',path);
const markerLayer=svg.append('g');
const joinToast=document.getElementById('joinToast'),countryPopup=document.getElementById('countryPopup');
let latestPeople=[],participantNumbers=new Map(),activeCountryCode=null,firstLoad=true,lastSeenId=0,toastTimer=null;
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(r=>r.json()).then(world=>{
  const geoms=world.objects.countries.geometries,palestineIds=new Set(['376','275']),moroccoIds=new Set(['504','732']),special=new Set([...palestineIds,...moroccoIds]);
  const regular={type:'GeometryCollection',geometries:geoms.filter(g=>!special.has(String(g.id)))};
  const land=topojson.feature(world,regular),layer=svg.insert('g',':first-child');
  layer.selectAll('path.regular').data(land.features).join('path').attr('class','land regular').attr('d',path);
  const pp=geoms.filter(g=>palestineIds.has(String(g.id))),mp=geoms.filter(g=>moroccoIds.has(String(g.id)));
  if(pp.length)layer.append('path').datum(topojson.merge(world,pp)).attr('class','land eventTerritory').attr('d',path);
  if(mp.length)layer.append('path').datum(topojson.merge(world,mp)).attr('class','land eventTerritory').attr('d',path);
});
function groupsFor(people){return Array.from(d3.group(people,d=>d.country_code),([code,members])=>{const last=members[members.length-1];return{code,country:last.country_name,lat:last.lat,lon:last.lon,members}})}
function closePopup(){activeCountryCode=null;countryPopup.classList.remove('show')}
function showJoin(person,number){closePopup();setFlag('joinFlag',person.country_code,person.country_name);document.getElementById('joinName').textContent=person.name;document.getElementById('joinCountry').textContent=person.country_name;document.getElementById('joinNumber').textContent='PARTICIPANT #'+number;joinToast.classList.remove('show');requestAnimationFrame(()=>joinToast.classList.add('show'));clearTimeout(toastTimer);toastTimer=setTimeout(()=>joinToast.classList.remove('show'),5000)}
function showCountry(group){clearTimeout(toastTimer);joinToast.classList.remove('show');activeCountryCode=group.code;setFlag('popupFlag',group.code,group.country);document.getElementById('popupName').textContent=group.country;document.getElementById('popupCount').textContent=group.members.length+' participant'+(group.members.length===1?'':'s');const list=document.getElementById('popupList');list.replaceChildren();group.members.slice().sort((a,b)=>a.id-b.id).forEach(p=>{const row=document.createElement('div');row.className='popupPerson';const n=document.createElement('div');n.className='popupNum';n.textContent='#'+(participantNumbers.get(p.id)||p.id);const nm=document.createElement('div');nm.className='popupPersonName';nm.textContent=p.name;row.append(n,nm);list.appendChild(row)});countryPopup.classList.add('show')}
function updateMarkers(people){const groups=groupsFor(people),sel=markerLayer.selectAll('g.countryMarker').data(groups,d=>d.code),enter=sel.enter().append('g').attr('class','countryMarker').attr('tabindex',0).attr('role','button');enter.append('circle').attr('class','dot').attr('r',7.5);enter.append('rect').attr('class','flagFrame').attr('x',-13).attr('y',-31).attr('width',26).attr('height',18).attr('rx',3);enter.append('image').attr('class','flagImg').attr('x',-11.5).attr('y',-29.5).attr('width',23).attr('height',15).attr('preserveAspectRatio','xMidYMid slice');enter.append('circle').attr('class','countBg').attr('cx',13).attr('cy',-27).attr('r',7.5);enter.append('text').attr('class','count').attr('x',13).attr('y',-27);const all=enter.merge(sel);all.attr('transform',d=>{const q=projection([d.lon,d.lat]);return q?`translate(${q[0]},${q[1]})`:'translate(-999,-999)'});all.select('.flagImg').attr('href',d=>flagUrl(d.code,80));all.select('.count').text(d=>d.members.length);all.on('click',(e,d)=>{e.stopPropagation();showCountry(d)}).on('keydown',(e,d)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();showCountry(d)}});sel.exit().remove();if(activeCountryCode){const g=groups.find(x=>x.code===activeCountryCode);if(g)showCountry(g);else closePopup()}}
document.addEventListener('pointerdown',e=>{if(countryPopup.classList.contains('show')&&!countryPopup.contains(e.target))closePopup()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePopup()});countryPopup.addEventListener('pointerdown',e=>e.stopPropagation());
async function refresh(){try{const r=await fetch(api+'?select=id,name,country_code,country_name,flag,lat,lon,created_at&order=id.asc',{headers,cache:'no-store'});if(!r.ok)throw new Error(await r.text());const raw=await r.json();const people=raw.filter(x=>x.country_code!=='IL').map(x=>x.country_code==='EH'?{...x,country_code:'MA',country_name:'Morocco'}:x);latestPeople=people;participantNumbers=new Map(people.map((p,i)=>[p.id,i+1]));const countrySet=new Set(people.map(p=>p.country_code));document.getElementById('count').textContent=people.length;document.getElementById('countries').textContent=countrySet.size;document.getElementById('focusCountries').textContent=countrySet.size;updateMarkers(people);if(people.length){const latest=people[people.length-1];document.getElementById('latestMini').innerHTML='Latest: <b>'+escapeHtml(latest.name)+'</b> · '+escapeHtml(latest.country_name);const maxId=Math.max(...people.map(p=>p.id));if(firstLoad){lastSeenId=maxId;firstLoad=false}else if(maxId>lastSeenId){const newcomers=people.filter(p=>p.id>lastSeenId).sort((a,b)=>a.id-b.id);const newest=newcomers[newcomers.length-1];showJoin(newest,participantNumbers.get(newest.id)||people.length);lastSeenId=maxId}}else{document.getElementById('latestMini').textContent='Waiting for the first participant…';if(firstLoad)firstLoad=false}}catch(e){document.getElementById('latestMini').textContent='Connection issue — retrying…'}}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
refresh();setInterval(refresh,2000);
</script>
</body>
</html>
